# UPAMPI — Nginx + Certbot (alternativa si el VPS ya usa Nginx)
# Instalar en: /etc/nginx/sites-available/upampi.conf  y enlazar en sites-enabled.
# Certificados: sudo certbot --nginx -d upampi.com -d www.upampi.com
# Validar: sudo nginx -t && sudo systemctl reload nginx

upstream upampi_contact {
    server 127.0.0.1:4321;
    keepalive 8;
}

# Rate limit adicional para el formulario (el endpoint también limita por IP)
limit_req_zone $binary_remote_addr zone=upampi_api:10m rate=10r/m;

# HTTP -> HTTPS (y desafío ACME)
server {
    listen 80;
    listen [::]:80;
    server_name upampi.com www.upampi.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://upampi.com$request_uri; }
}

# www -> apex
server {
    # "listen ... ssl http2" funciona en Nginx 1.18 (Ubuntu 22.04) y 1.24 (24.04).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.upampi.com;
    ssl_certificate     /etc/letsencrypt/live/upampi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upampi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://upampi.com$request_uri;
}

server {
    # "listen ... ssl http2" funciona en Nginx 1.18 (Ubuntu 22.04) y 1.24 (24.04).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upampi.com;

    ssl_certificate     /etc/letsencrypt/live/upampi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upampi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/upampi/current/dist/client;
    server_tokens off;
    charset utf-8;

    # Compresión (gzip nativo; zstd requiere módulo externo)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml text/xml;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src https://cal.com https://app.cal.com https://calendly.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Formulario -> Node
    location /api/ {
        limit_req zone=upampi_api burst=5 nodelay;
        client_max_body_size 64k;
        proxy_pass http://upampi_contact;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Assets con hash: 1 año inmutable (add_header aquí reemplaza los heredados, por eso se repiten los básicos)
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* ^/(og|icons)/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML y resto: siempre revalidar
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src https://cal.com https://app.cal.com https://calendly.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; }

    access_log /var/log/nginx/upampi.access.log;
    error_log  /var/log/nginx/upampi.error.log warn;
}
